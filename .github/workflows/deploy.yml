name: Publier le site

on:
  push:
    branches: [main]
  schedule:
    # Tous les jours à 6 h UTC : publie les recettes programmées dont la date est arrivée.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.js
        env:
          # À retirer, avec la ligne base-path, le jour où cuisineaumiel.fr est branché.
          SITE_URL: https://sfedoraw.github.io/cuisineaumiel
      # Adresse provisoire sfedoraw.github.io/cuisineaumiel/ tant que cuisineaumiel.fr n'est pas branché.
      # Le jour où le domaine fonctionne : supprimer cette ligne.
      - run: node base-path.js /cuisineaumiel
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
